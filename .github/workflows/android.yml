name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 自带 Android SDK，不再用 setup-android（其内置 sdkmanager 在新版 runner 上崩）
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Decode keystore
        run: |
          if [ -f signing/jjz-release.keystore.b64 ]; then
            # 清洗掉可能混入的非法字符（BOM/空白/换行）再解码
            tr -cd 'A-Za-z0-9+/=' < signing/jjz-release.keystore.b64 | base64 -d > jjz-release.keystore
            echo "sha256 of decoded keystore:"
            sha256sum jjz-release.keystore
            if ! sha256sum -c <<< "78517c9e4ef4d52e18787fa1f12fbb9c84857df86126cea0c2da225d8cefcff4  jjz-release.keystore"; then
              echo "keystore checksum mismatch!"
              exit 1
            fi
            echo "keystore decoded and verified"
          else
            echo "no keystore in repo, build unsigned"
          fi

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Create release (signed builds only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          TAG="v$VER"
          if ls app/build/outputs/apk/release/*unsigned* > /dev/null 2>&1; then
            echo "unsigned build, skip release"
          elif gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release $TAG exists, skip"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes "CI build $TAG" \
              app/build/outputs/apk/release/*.apk
          fi
